name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy manually from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-progress one rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli requires Node >=22.
          node-version: 22
          cache: npm

      # Using `npm install` rather than `npm ci`: some Rust-based build tools
      # (lightningcss/Tailwind v4's engine) ship platform-specific optional
      # peer dependencies (@napi-rs/wasm-runtime -> @emnapi/*) that npm
      # resolves differently depending on the installing OS/arch, so a lock
      # file written on macOS can look "out of sync" to npm ci on Linux even
      # though nothing is actually wrong. `npm install` just resolves for the
      # current platform instead of demanding an exact pre-listed match.
      - run: npm install
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
